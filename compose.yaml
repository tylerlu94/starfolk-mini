services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sfkm
      POSTGRES_PASSWORD: sfkm
      POSTGRES_USER: sfkm
    ports:
      - "${SFKM_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfkm -d sfkm"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - sfkm-postgres:/var/lib/postgresql/data

volumes:
  sfkm-postgres:
